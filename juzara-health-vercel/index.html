or:#7b7771;font-size:11px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#9ba6a3;font-weight:900;margin:12px 10px 7px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:13px;color:#68777b;font-weight:800;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:var(--teal2);color:#258f84}.nav .ico{font-size:18px;width:22px;text-align:center}.sidebar-bottom{margin-top:auto}.main{min-width:0}.hero{background:linear-gradient(110deg,#5ccfc3,#83ded0);border-radius:27px;padding:26px 30px;color:#fff;position:relative;overflow:hidden;min-height:175px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 15px 35px #58c9bc35}.hero:after{content:"☁️      ✦       ☁️";position:absolute;right:10px;top:10px;font-size:24px;opacity:.7;letter-spacing:20px}.hero h1{font-size:28px;margin:0 0 5px;font-weight:900}.hero p{margin:0;color:#edfffb;font-weight:700}.hero-art{font-size:90px;filter:drop-shadow(0 10px 5px #287e7040);z-index:1}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 13px}.section-head h2{font-size:19px;margin:0;font-weight:900}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:17px}.stat{padding:17px;border-radius:21px;background:#fff;box-shadow:var(--shadow);border:1px solid #fff}.stat .sicon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:9px}.stat strong{font-size:23px;display:block}.stat small{color:var(--muted);font-weight:700}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}.card{padding:19px}.card h3{margin:0 0 6px;font-size:16px}.muted{color:var(--muted);font-size:13px}.appointment{display:flex;align-items:center;gap:13px;padding:14px;background:#f2fbf8;border-radius:17px;margin-top:12px}.doc-avatar{width:48px;height:48px;border-radius:16px;background:#ffe3d7;display:grid;place-items:center;font-size:26px}.appointment b{display:block}.appointment small{color:var(--muted)}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#e5f8ec;color:#39845b;font-size:10px;font-weight:900}.queue{background:linear-gradient(135deg,#fff0cf,#ffe0c9);border-radius:19px;padding:16px;margin-top:12px}.queue-num{font-size:32px;font-weight:900;color:#d85e2e}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick button{background:#fff;border:1px solid #f0f2ed;border-radius:18px;padding:16px 8px;text-align:center;color:var(--ink);font-weight:900;box-shadow:0 7px 18px #345d5010}.quick button span{display:block;font-size:25px;margin-bottom:6px}.quick button small{font-size:11px;color:var(--muted)}.panel{padding:24px;min-height:500px}.page-title{margin:0 0 5px;font-size:25px;font-weight:900}.page-sub{margin:0 0 22px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:#53636a}.field input,.field select,.field textarea{width:100%;border:1px solid #e6eeea;background:#fbfdfb;border-radius:12px;padding:12px 13px;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #56cfc322}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.list{display:grid;gap:11px}.item{background:#fff;border:1px solid #edf1ed;border-radius:17px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item-left{display:flex;align-items:center;gap:12px}.item h4{margin:0 0 3px}.item p{margin:0;color:var(--muted);font-size:12px}.chip{font-size:11px;font-weight:900;background:#eff8f5;color:#348b7d;border-radius:99px;padding:6px 10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs button{background:#f4f7f5;padding:9px 13px;border-radius:99px;font-size:12px;font-weight:900;color:#69777a}.tabs button.active{background:var(--teal);color:#fff}.table-wrap{overflow:auto;border:1px solid #edf1ed;border-radius:16px}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}th,td{text-align:left;padding:12px;border-bottom:1px solid #eef1ef;white-space:nowrap}th{background:#f2fbf8;color:#52716b;font-size:11px}tr:last-child td{border:0}.auth-wrap{max-width:1000px;margin:25px auto;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);min-height:610px}.auth-art{background:linear-gradient(150deg,#57cfc3,#a4e7d9 65%,#ffe2bd);padding:35px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.auth-art h1{color:#fff;font-size:32px;line-height:1.1}.auth-art p{color:#edfffb;font-weight:700}.mascot{font-size:130px;text-align:center;filter:drop-shadow(0 15px 7px #277a7040)}.auth-box{padding:45px 40px;display:flex;flex-direction:column;justify-content:center}.auth-box h2{font-size:26px;margin:0 0 5px}.auth-box .muted{margin:0 0 22px}.link{color:#25998b;font-weight:900;background:none;padding:0}.alert{padding:11px 13px;border-radius:12px;background:#fff0ee;color:#c95747;font-size:12px;font-weight:800;margin:10px 0}.success{background:#e8f8ed;color:#347d50}.notice{background:#fff8e8;border:1px solid #ffebc2;padding:13px 15px;border-radius:14px;font-size:12px;color:#82622c;margin:14px 0}.searchbar{display:flex;gap:9px;margin-bottom:15px}.searchbar input{flex:1;min-width:0;border:1px solid #e6eeea;border-radius:13px;padding:12px}.article{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #edf1ed}.article-cover{height:105px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#c9f2e8,#ffe1c6)}.article-body{padding:14px}.article-body h4{margin:4px 0}.article-body p{font-size:12px;color:var(--muted)}.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.chat{background:#f3fbf8;border-radius:18px;padding:16px;min-height:240px}.bubble{max-width:85%;padding:11px 13px;border-radius:15px;background:#fff;margin:9px 0;font-size:13px}.bubble.me{background:#d8f5ee;margin-left:auto}.chat-compose{display:flex;gap:8px;margin-top:12px}.chat-compose input{flex:1;min-width:0;border:1px solid #e3ebe7;border-radius:12px;padding:11px}.toast{position:fixed;bottom:20px;right:20px;background:#25323c;color:#fff;padding:13px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:99;font-size:13px}.mobile-menu{display:none}.footer-note{font-size:11px;color:#8a9894;margin-top:16px;text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{height:auto;min-height:0;position:static;padding:12px}.sidebar .nav{display:grid;grid-template-columns:repeat(3,1fr)}.sidebar .nav-label,.sidebar-bottom,.user-mini{display:none}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero-art{font-size:65px}.article-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.app{padding:12px}.topbar{padding:5px 2px 13px}.brand{font-size:18px}.top-actions .pill{display:none}.layout{gap:12px}.sidebar{border-radius:18px}.sidebar .nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:10px;padding:9px 4px;justify-content:center;flex-direction:column;gap:3px}.nav .ico{font-size:17px}.hero{padding:22px;min-height:145px}.hero h1{font-size:22px}.hero-art{font-size:50px}.panel{padding:17px;border-radius:20px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:20px}.quick{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.auth-wrap{grid-template-columns:1fr;margin:10px auto}.auth-art{min-height:220px;padding:23px}.auth-art h1{font-size:24px}.mascot{font-size:65px}.auth-box{padding:27px 22px}.article-grid{grid-template-columns:1fr 1fr}.section-head h2{font-size:17px}}

<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">✚</div><div>JUZARA <span style="color:#36b8aa">Health</span><small>YOUR HEALTH, OUR PRIORITY.</small></div></div><div class="top-actions"><span class="pill">🌤️ Sehat dimulai dari langkah kecil</span><button class="pill" onclick="showAuth('patient')">Masuk</button></div></header>
<div id="root"></div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const doctors=[
{name:'dr. Zaskiya Dwi Anugrah',spec:'Dokter Umum',day:'Senin',hours:'08.00–12.00 WITA',emoji:'👩🏻‍⚕️'},
{name:'drg. Bayu Liburaya',spec:'Dokter Gigi',day:'Selasa',hours:'13.00–17.00 WITA',emoji:'👨🏻‍⚕️'},
{name:'dr. Juniar Rahman Sp.DP',spec:'Spesialis Penyakit Dalam',day:'Rabu',hours:'10.00–15.00 WITA',emoji:'👨🏽‍⚕️'},
{name:'dr. Muhammad Zidan Sp.A',spec:'Spesialis Anak',day:'Kamis',hours:'08.00–12.00 WITA',emoji:'👨🏻‍⚕️'},
{name:'dr. Zahra Nur Habibah Sp.OG',spec:'Spesialis Kandungan',day:'Jumat',hours:'13.00–17.00 WITA',emoji:'👩🏽‍⚕️'}
];
const facilities=[{name:'Puskesmas Sehat Makassar',type:'Puskesmas',loc:'Makassar',emoji:'🏥'},{name:'Klinik Ceria Medika',type:'Klinik',loc:'Makassar',emoji:'🩺'},{name:'Rumah Sakit Bintang Sehat',type:'Rumah Sakit',loc:'Makassar',emoji:'🏨'},{name:'Laboratorium Prima',type:'Laboratorium',loc:'Makassar',emoji:'🧪'}];
let user=JSON.parse(localStorage.getItem('juzara_user')||'null'), profile=user?{...user}:null, appointments=JSON.parse(localStorage.getItem('juzara_appointments')||'[]'), chats=[], current='home', role='patient', activeDoctor=doctors[0], activeFacility=facilities[0], doctorLogged=false;
const root=document.getElementById('root');
function save(){localStorage.setItem('juzara_user',JSON.stringify(profile));localStorage.setItem('juzara_appointments',JSON.stringify(appointments))}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function showAuth(which='patient',mode='login'){role=which;root.innerHTML=authHTML(which,mode)}
function authHTML(which,mode){let doc=which==='doctor';return `<div class="auth-wrap"><section class="auth-art"><div><div class="brand" style="color:white"><div class="brand-mark" style="background:#ffffff40">✚</div>JUZARA Health</div><h1>${doc?'Portal Dokter':'Halo, Sahabat Sehat!'}<br>${doc?'Selamat bertugas.':'Yuk, mulai hidup lebih sehat.'}</h1><p>${doc?'Akses profesional untuk pelayanan yang lebih baik.':'Temani perjalanan kesehatanmu dengan cara yang lebih mudah dan menyenangkan.'}</p></div><div class="mascot">${doc?'🧑🏻‍⚕️':'🐯'}</div><small style="color:#fff;font-weight:800">✦ Care • Connect • Grow ✦</small></section><section class="auth-box"><h2>${mode==='register'?'Buat akun pasien':'Selamat datang kembali!'}</h2><p class="muted">${doc?'Login khusus tenaga medis terverifikasi.':'Masuk ke akun JUZARA Health kamu.'}</p><div id="authError"></div>${mode==='register'?registerFields():`<div class="field" style="margin-bottom:13px"><label>${doc?'Email dokter':'Email atau username'}</label><input id="loginEmail" placeholder="${doc?'dokter@juzara.id':'nama@email.com'}"></div><div class="field"><label>Password</label><div style="display:flex;gap:7px"><input id="loginPass" type="password" placeholder="Masukkan password" style="flex:1"><button class="soft" onclick="togglePass('loginPass')">👁</button></div></div>`}<button class="primary" style="width:100%;margin-top:18px" onclick="${mode==='register'?'register()':doc?'doctorLogin()':'patientLogin()'}">${mode==='register'?'Daftar Sekarang':'Masuk'}</button>${!doc&&mode==='login'?`<p class="muted" style="text-align:center;margin:14px 0 0"><button class="link" onclick="toast('Fitur reset password demo: hubungi admin JUZARA.')">Lupa password?</button> · <button class="link" onclick="showAuth('patient','register')">Registrasi</button></p>`:''}<p class="muted" style="text-align:center;margin-top:22px">${doc?'Bukan dokter? ':'Tenaga medis? '}<button class="link" onclick="showAuth('${doc?'patient':'doctor'}')">${doc?'Login pasien':'Portal dokter'}</button></p><button class="link" style="margin-top:12px" onclick="renderLanding()">← Kembali ke halaman awal</button>${doc?'<div class="notice">🔒 Akses dokter dibatasi untuk akun yang telah diverifikasi oleh administrator. Demo login: <b>dokter@juzara.id</b> / <b>dokter123</b>.</div>':''}</section></div>`}
function registerFields(){return `<div class="form-grid"><div class="field full"><label>Nama lengkap</label><input id="rName" placeholder="Nama sesuai identitas"></div><div class="field"><label>Nomor identitas</label><input id="rId" placeholder="NIK / nomor identitas"></div><div class="field"><label>Tanggal lahir</label><input id="rDob" type="date" min="1980-01-01" max="2026-12-31"></div><div class="field"><label>Jenis kelamin</label><select id="rGender"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select></div><div class="field"><label>Nomor telepon</label><input id="rPhone" placeholder="08xxxxxxxxxx"></div><div class="field full"><label>Alamat lengkap</label><input id="rAddress" placeholder="Alamat domisili"></div><div class="field full"><label>Email</label><input id="rEmail" type="email" placeholder="nama@email.com"></div><div class="field"><label>Password</label><input id="rPass" type="password"></div><div class="field"><label>Konfirmasi password</label><input id="rConfirm" type="password"></div></div>`}
function renderLanding(){root.innerHTML=`<section class="hero"><div><h1>Sehat lebih mudah,<br>mulai dari JUZARA! 🌈</h1><p>Temukan dokter, atur konsultasi, dan pantau kesehatanmu dalam satu tempat.</p><div class="actions"><button class="primary" onclick="showAuth('patient')">Mulai Sekarang →</button><button class="soft" onclick="showAuth('doctor')">Portal Dokter</button></div></div><div class="hero-art">🐯🩺</div></section><div class="section-head"><div><h2>Semua kebutuhan sehatmu, satu aplikasi</h2><p>Praktis, ramah, dan mudah digunakan.</p></div></div><div class="grid three"><div class="card"><div class="sicon">📅</div><h3>Janji Konsultasi</h3><p class="muted">Pilih dokter dan jadwal tanpa perlu antre lama.</p></div><div class="card"><div class="sicon">🎟️</div><h3>Antrean Online</h3><p class="muted">Pantau nomor antrean dan estimasi waktu tunggu.</p></div><div class="card"><div class="sicon">💚</div><h3>Catatan Kesehatan</h3><p class="muted">Lihat riwayat konsultasi dan hasil pemeriksaan.</p></div></div><p class="footer-note">JUZARA Health · Demo antarmuka digital healthcare</p>`}
function register(){let v=id=>document.getElementById(id).value.trim(),name=v('rName'),email=v('rEmail'),pass=v('rPass');if(!name||!v('rId')||!v('rDob')||!v('rGender')||!v('rPhone')||!v('rAddress')||!email||!pass){return authError('Lengkapi semua data terlebih dahulu.')}if(pass!==v('rConfirm'))return authError('Konfirmasi password belum sama.');if(new Date(v('rDob')).getFullYear()<1980||new Date(v('rDob')).getFullYear()>2026)return authError('Tahun lahir harus 1980–2026.');profile={name,email,password:pass,id:v('rId'),dob:v('rDob'),gender:v('rGender'),phone:v('rPhone'),address:v('rAddress'),status:'Terverifikasi demo',facility:facilities[0].name,photo:'🙂'};save();toast('Registrasi berhasil!');renderApp()}
function authError(msg){document.getElementById('authError').innerHTML=`<div class="alert">${msg}</div>`}
function patientLogin(){let e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;if(!profile||e!==profile.email||p!==profile.password)return authError('Email/username atau password tidak sesuai. Silakan registrasi terlebih dahulu.');renderApp()}
function doctorLogin(){let e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;if(e!=='dokter@juzara.id'||p!=='dokter123')return authError('Akun dokter belum terverifikasi atau data login salah.');doctorLogged=true;role='doctor';current='docHome';renderDoctor()}
function togglePass(id){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password'}
function renderApp(){if(!profile){renderLanding();return}role='patient';let nav=[['home','⌂','Beranda'],['booking','＋','Pendaftaran'],['queue','🎟','Antrean Online'],['facilities','🏥','Cari Faskes'],['doctors','🩺','Jadwal Dokter'],['consult','💬','Konsultasi'],['labs','🧪','Hasil Lab'],['education','📚','Edukasi'],['history','🗂','Riwayat'],['profile','👤','Data Diri'],['settings','⚙','Pengaturan']];root.innerHTML=`<div class="layout"><aside class="sidebar"><div class="user-mini"><div class="avatar">${profile.photo||'🙂'}</div><div><b>${profile.name}</b><small>Pasien · ${profile.status}</small></div></div><div class="nav-label">MENU UTAMA</div><nav class="nav">${nav.map(n=>`<button class="${current===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="notice">💚 Jaga kesehatan, satu langkah setiap hari!</div><button class="danger" style="width:100%" onclick="logout()">↪ Keluar akun</button></div></aside><main class="main" id="page"></main></div>`;renderPage()}
function go(p){current=p;renderApp()}
function renderPage(){let p=document.getElementById('page');if(!p)return;let pages={home:homePage,booking:bookingPage,queue:queuePage,facilities:facilitiesPage,doctors:doctorsPage,consult:consultPage,labs:labsPage,education:educationPage,history:historyPage,profile:profilePage,settings:settingsPage};p.innerHTML=(pages[current]||homePage)()}
function homePage(){let next=appointments.find(a=>a.status!=='Selesai'&&a.status!=='Dibatalkan');return `<section class="hero"><div><h1>Hai, ${profile.name.split(' ')[0]}! 👋</h1><p>Bagaimana kabarmu hari ini? Yuk, tetap jaga kesehatan.</p><div class="actions"><button class="primary" onclick="go('booking')">＋ Buat janji konsultasi</button></div></div><div class="hero-art">🐯💚</div></section><div class="grid stats"><div class="stat"><div class="sicon" style="background:#e2f8f2">📅</div><strong>${appointments.length}</strong><small>Total janji konsultasi</small></div><div class="stat"><div class="sicon" style="background:#fff0df">🎟️</div><strong>${next?next.number:'—'}</strong><small>Antrean aktif</small></div><div class="stat"><div class="sicon" style="background:#e9efff">🧪</div><strong>2</strong><small>Hasil lab tersedia</small></div><div class="stat"><div class="sicon" style="background:#ffe9e6">💚</div><strong>Aktif</strong><small>Status akun</small></div></div><div class="section-head"><div><h2>Akses cepat ✨</h2><p>Fitur yang sering kamu gunakan.</p></div></div><div class="quick"><button onclick="go('booking')"><span>🗓️</span>Janji Dokter<small>Atur kunjungan</small></button><button onclick="go('queue')"><span>🎟️</span>Antrean Online<small>Pantau giliran</small></button><button onclick="go('facilities')"><span>🏥</span>Faskes<small>Cari layanan</small></button><button onclick="go('labs')"><span>🧪</span>Hasil Lab<small>Lihat hasil</small></button></div><div class="grid two" style="margin-top:18px"><div class="card"><h3>📍 Fasilitas kesehatan pilihan</h3><div class="appointment"><div class="doc-avatar">🏥</div><div><b>${profile.facility||facilities[0].name}</b><small>Fasilitas terdaftar · Makassar</small></div></div></div><div class="card"><h3>🔔 Notifikasi terbaru</h3><div class="appointment"><div class="doc-avatar">🌿</div><div><b>Selamat datang di JUZARA!</b><small>Akunmu siap digunakan untuk demo.</small></div></div></div></div><div class="section-head"><div><h2>Jadwal konsultasi berikutnya</h2><p>Jangan lewatkan jadwal kesehatanmu.</p></div><button class="link" onclick="go('history')">Lihat semua</button></div>${next?`<div class="card"><div class="appointment"><div class="doc-avatar">${next.doctorEmoji}</div><div style="flex:1"><b>${next.doctor}</b><small>${next.facility} · ${next.date} · ${next.hours}</small></div><span class="tag">${next.status}</span></div></div>`:`<div class="card muted">Belum ada jadwal konsultasi. Buat janji pertamamu sekarang! <button class="link" onclick="go('booking')">Buat janji →</button></div>`}`}
function bookingPage(){return `<h1 class="page-title">Pendaftaran Konsultasi 🗓️</h1><p class="page-sub">Pilih fasilitas, dokter, dan waktu yang sesuai.</p><div class="card"><div class="form-grid"><div class="field"><label>Fasilitas kesehatan</label><select id="bFacility">${facilities.map((f,i)=>`<option value="${i}">${f.name} — ${f.type}</option>`)}</select></div><div class="field"><label>Dokter</label><select id="bDoctor">${doctors.map((d,i)=>`<option value="${i}">${d.name} (${d.spec})</option>`)}</select></div><div class="field"><label>Tanggal kunjungan</label><input id="bDate" type="date" min="2026-11-06"></div><div class="field"><label>Keluhan singkat</label><input id="bComplaint" placeholder="Ceritakan keluhan utama"></div></div><div class="notice">💡 Nomor antrean dibuat otomatis berdasarkan fasilitas, dokter, dan tanggal pelayanan. Jadwal mengikuti hari praktik dokter.</div><div class="actions"><button class="primary" onclick="createAppointment()">Konfirmasi pendaftaran →</button></div></div>`}
function createAppointment(){let fi=+document.getElementById('bFacility').value,di=+document.getElementById('bDoctor').value,date=document.getElementById('bDate').value,complaint=document.getElementById('bComplaint').value;if(!date||!complaint)return toast('Isi tanggal dan keluhan terlebih dahulu.');let d=doctors[di],day=new Date(date+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long'});if(day.toLowerCase()!==d.day.toLowerCase())return toast('Dokter ini praktik hari '+d.day+'. Silakan pilih tanggal yang sesuai.');let same=appointments.filter(a=>a.date===date&&a.doctor===d.name&&a.facility===facilities[fi].name);let a={id:Date.now(),number:'A'+String(same.length+1).padStart(3,'0'),name:profile.name,doctor:d.name,doctorEmoji:d.emoji,facility:facilities[fi].name,date,hours:d.hours,complaint,status:'Terdaftar',ahead:same.length,estimate:same.length*15};appointments.unshift(a);save();toast('Janji berhasil dibuat. Nomor antrean '+a.number);go('queue')}
function queuePage(){return `<h1 class="page-title">Antrean Online 🎟️</h1><p class="page-sub">Pantau antrean dan estimasi giliranmu.</p>${appointments.length?`<div class="list">${appointments.map(a=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><span class="muted">NOMOR ANTREAN</span><div class="queue-num">${a.number}</div></div><span class="tag">${a.status}</span></div><div class="grid two"><div><b>${a.doctor}</b><div class="muted">${a.facility}</div><div class="muted">${a.date} · ${a.hours}</div></div><div class="queue"><b>${a.ahead} pasien di depan</b><div class="muted">Estimasi tunggu: ±${a.estimate} menit</div></div></div><div class="actions"><button class="soft" onclick="toast('Antrean diperbarui untuk demo.')">↻ Perbarui status</button><button class="danger" onclick="cancelAppointment(${a.id})">Batalkan</button></div></div>`).join('')}</div>`:`<div class="card muted">Belum ada antrean. <button class="link" onclick="go('booking')">Daftar konsultasi →</button></div>`}<div class="notice">Status antrean: Terdaftar · Menunggu · Sedang dilayani · Selesai · Dibatalkan · Tidak hadir. Perubahan status otomatis membutuhkan integrasi petugas/faskes.</div>`}
function cancelAppointment(id){appointments=appointments.map(a=>a.id===id?{...a,status:'Dibatalkan'}:a);save();renderPage();toast('Janji dibatalkan.')}
function facilitiesPage(){return `<h1 class="page-title">Cari Fasilitas Kesehatan 🏥</h1><p class="page-sub">Pilih layanan kesehatan yang kamu butuhkan.</p><div class="searchbar"><input id="facilitySearch" placeholder="Cari puskesmas, klinik, rumah sakit..." oninput="filterFacilities()"></div><div id="facilityList" class="grid two">${facilityCards(facilities)}</div>`}
function facilityCards(arr){return arr.map((f,i)=>`<div class="card"><div style="font-size:32px">${f.emoji}</div><h3>${f.name}</h3><p class="muted">${f.type} · ${f.loc}</p><span class="tag">Layanan tersedia</span><div class="actions"><button class="soft" onclick="chooseFacility(${i})">Pilih fasilitas</button></div></div>`).join('')}
function filterFacilities(){let q=document.getElementById('facilitySearch').value.toLowerCase();document.getElementById('facilityList').innerHTML=facilityCards(facilities.filter(f=>(f.name+f.type).toLowerCase().includes(q)))}
function chooseFacility(i){activeFacility=facilities[i];profile.facility=activeFacility.name;save();toast('Fasilitas pilihan diperbarui.');go('booking')}
function doctorsPage(){return `<h1 class="page-title">Jadwal Dokter 🩺</h1><p class="page-sub">Pilih dokter berdasarkan layanan dan jadwal praktik.</p><div class="list">${doctors.map((d,i)=>`<div class="item"><div class="item-left"><div class="doc-avatar">${d.emoji}</div><div><h4>${d.name}</h4><p>${d.spec} · ${d.day}, ${d.hours}</p></div></div><button class="soft" onclick="activeDoctor=doctors[${i}];go('booking')">Buat janji</button></div>`).join('')}</div><div class="notice">Jadwal merupakan data contoh dan perlu dikonfirmasi langsung dengan fasilitas kesehatan.</div>`}
function consultPage(){return `<h1 class="page-title">Konsultasi Dokter 💬</h1><p class="page-sub">Ruang komunikasi pasien dan dokter.</p><div class="grid two"><div class="card"><h3>Dokter yang tersedia</h3>${doctors.map((d,i)=>`<div class="appointment" onclick="activeDoctor=doctors[${i}];renderPage()" style="cursor:pointer"><div class="doc-avatar">${d.emoji}</div><div><b>${d.name}</b><small>${d.spec} · ${d.day}</small></div></div>`).join('')}</div><div class="card"><h3>Ruang konsultasi</h3><p class="muted">Dengan ${activeDoctor.name}</p><div class="chat" id="chatbox"><div class="bubble">Halo! Silakan ceritakan keluhan yang ingin kamu konsultasikan.</div>${chats.map(c=>`<div class="bubble me">${c}</div>`).join('')}</div><div class="chat-compose"><input id="chatInput" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">Kirim</button></div><div class="notice">Demo percakapan. Bukan layanan diagnosis atau konsultasi medis langsung.</div></div></div>`}
function sendChat(){let x=document.getElementById('chatInput');if(!x.value.trim())return;chats.push(x.value.trim());renderPage()}
function labsPage(){let rows=[['Hemoglobin','Darah lengkap','06 Nov 2026','13,5','g/dL','12–16','Normal'],['Glukosa puasa','Kimia darah','06 Nov 2026','92','mg/dL','70–100','Normal'],['Kolesterol total','Profil lipid','06 Nov 2026','—','mg/dL','<200','Menunggu']];return `<h1 class="page-title">Hasil Laboratorium 🧪</h1><p class="page-sub">Pantau hasil pemeriksaan dan riwayat kesehatanmu.</p><div class="card"><div class="section-head" style="margin-top:0"><h3>Hasil pemeriksaan</h3><span class="tag">2 tervalidasi</span></div><div class="table-wrap"><table><thead><tr><th>Pemeriksaan</th><th>Tanggal</th><th>Hasil</th><th>Satuan</th><th>Rentang referensi</th><th>Interpretasi</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="actions"><button class="soft" onclick="window.print()">⬇ Cetak / Simpan PDF</button></div><div class="notice">Data laboratorium di atas hanya contoh tampilan, bukan hasil medis pasien.</div></div><div class="card" style="margin-top:15px"><h3>📈 Perkembangan hasil</h3><p class="muted">Grafik tren akan tampil setelah tersedia beberapa hasil pemeriksaan tervalidasi.</p><div style="height:85px;display:flex;align-items:end;gap:12px;padding:8px 15px;background:#f3fbf8;border-radius:14px"><div style="height:45%;background:#63cfc0;flex:1;border-radius:8px 8px 0 0"></div><div style="height:60%;background:#63cfc0;flex:1;border-radius:8px 8px 0 0"></div><div style="height:55%;background:#63cfc0;flex:1;border-radius:8px 8px 0 0"></div><div style="height:72%;background:#ffb46d;flex:1;border-radius:8px 8px 0 0"></div><div style="height:68%;background:#63cfc0;flex:1;border-radius:8px 8px 0 0"></div></div></div>`}
const articles=[['🫧','Kesehatan umum','Kebiasaan kecil untuk tubuh yang lebih sehat','Mulai dari tidur cukup, minum air, dan bergerak secara teratur.'],['🧸','Kesehatan anak','Mendukung tumbuh kembang anak','Perhatikan nutrisi, imunisasi, dan pemeriksaan berkala.'],['🌷','Kesehatan wanita','Kenali siklus menstruasi','Catat perubahan siklus dan konsultasikan keluhan yang mengganggu.'],['🦷','Kesehatan gigi','Senyum sehat dimulai dari kebiasaan','Sikat gigi dua kali sehari dan lakukan pemeriksaan rutin.'],['🥑','Nutrisi','Isi piring dengan gizi seimbang','Variasikan sumber karbohidrat, protein, sayur, dan buah.'],['🧠','Kesehatan mental','Istirahat juga bagian dari produktivitas','Kenali batas diri dan cari dukungan saat membutuhkannya.'],['🛡️','Pencegahan penyakit','Langkah sederhana mencegah infeksi','Biasakan cuci tangan dan ikuti anjuran vaksinasi.']];
function educationPage(){return `<h1 class="page-title">Ruang Edukasi 🌈</h1><p class="page-sub">Informasi kesehatan dengan bahasa yang mudah dipahami.</p><div class="searchbar"><input id="articleSearch" placeholder="Cari artikel atau kategori..." oninput="filterArticles()"></div><div class="tabs">${['Semua','Kesehatan umum','Kesehatan anak','Kesehatan wanita','Kesehatan gigi','Nutrisi','Kesehatan mental','Pencegahan penyakit'].map((c,i)=>`<button class="${i===0?'active':''}" onclick="articleCategory('${c}',this)">${c}</button>`).join('')}</div><div id="articleGrid" class="article-grid">${articleCards(articles)}</div>`}
function articleCards(arr){return arr.map(a=>`<article class="article"><div class="article-cover">${a[0]}</div><div class="article-body"><span class="chip">${a[1]}</span><h4>${a[2]}</h4><p>${a[3]}</p><button class="link" onclick="toast('Artikel edukasi demo: '+${JSON.stringify(a[2])})">Baca selengkapnya →</button></div></article>`).join('')}
function filterArticles(){let q=document.getElementById('articleSearch').value.toLowerCase();document.getElementById('articleGrid').innerHTML=articleCards(articles.filter(a=>a.join(' ').toLowerCase().includes(q)))}
function articleCategory(c,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('articleGrid').innerHTML=articleCards(c==='Semua'?articles:articles.filter(a=>a[1]===c))}
function historyPage(){return `<h1 class="page-title">Riwayat Kunjungan 🗂️</h1><p class="page-sub">Semua janji konsultasi dan status kunjunganmu.</p>${appointments.length?`<div class="list">${appointments.map(a=>`<div class="item"><div class="item-left"><div class="doc-avatar">🩺</div><div><h4>${a.doctor}</h4><p>${a.facility} · ${a.date} · ${a.number}</p></div></div><span class="tag">${a.status}</span></div>`).join('')}</div>`:`<div class="card muted">Riwayat kunjungan masih kosong.</div>`}`}
function profilePage(){return `<h1 class="page-title">Data Diri 👤</h1><p class="page-sub">Pastikan informasi akunmu selalu terbaru.</p><div class="card"><div class="user-mini"><div class="avatar">${profile.photo||'🙂'}</div><div><b>${profile.name}</b><small>Nomor rekam medis: JZ-${String(profile.id).slice(-4)||'0000'}</small></div><button class="soft" onclick="changePhoto()">Ubah foto</button></div><div class="form-grid"><div class="field"><label>Nama lengkap</label><input id="pName" value="${esc(profile.name)}"></div><div class="field"><label>Nomor identitas</label><input id="pId" value="${esc(profile.id)}"></div><div class="field"><label>Tanggal lahir</label><input id="pDob" type="date" min="1980-01-01" max="2026-12-31" value="${profile.dob||''}"></div><div class="field"><label>Jenis kelamin</label><select id="pGender"><option ${profile.gender==='Laki-laki'?'selected':''}>Laki-laki</option><option ${profile.gender==='Perempuan'?'selected':''}>Perempuan</option></select></div><div class="field"><label>Nomor telepon</label><input id="pPhone" value="${esc(profile.phone)}"></div><div class="field"><label>Email</label><input id="pEmail" value="${esc(profile.email)}"></div><div class="field full"><label>Alamat lengkap</label><textarea id="pAddress">${esc(profile.address)}</textarea></div><div class="field full"><label>Fasilitas kesehatan terdaftar</label><input value="${esc(profile.facility||'Belum dipilih')}" disabled></div></div><div class="actions"><button class="primary" onclick="saveProfile()">Simpan perubahan</button><button class="soft" onclick="renderPage()">Batalkan</button></div></div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveProfile(){profile={...profile,name:document.getElementById('pName').value,id:document.getElementById('pId').value,dob:document.getElementById('pDob').value,gender:document.getElementById('pGender').value,phone:document.getElementById('pPhone').value,email:document.getElementById('pEmail').value,address:document.getElementById('pAddress').value};save();toast('Profil berhasil disimpan.');renderPage()}
function changePhoto(){let p=prompt('Pilih emoji foto profil (contoh: 🙂 🌸 🐯):',profile.photo||'🙂');if(p){profile.photo=p;save();renderPage()}}
function settingsPage(){return `<h1 class="page-title">Pengaturan Akun ⚙️</h1><p class="page-sub">Atur keamanan dan preferensi akun.</p><div class="list"><div class="item"><div><h4>🔔 Notifikasi</h4><p>Pengingat jadwal dan giliran antrean</p></div><span class="tag">Aktif (demo)</span></div><div class="item"><div><h4>🔐 Keamanan akun</h4><p>Perbarui password dan informasi login</p></div><button class="soft" onclick="toast('Pengaturan password memerlukan backend.')">Kelola</button></div><div class="item"><div><h4>🧾 Status akun</h4><p>${profile.status}</p></div><span class="tag">Aktif</span></div></div><div class="notice">Untuk melindungi data kesehatan, versi produksi perlu menerapkan enkripsi, kontrol akses, persetujuan pasien, dan audit log.</div>`}
function logout(){user=null;profile=null;localStorage.removeItem('juzara_user');current='home';renderLanding();toast('Kamu telah keluar.')}
function renderDoctor(){root.innerHTML=`<div class="layout"><aside class="sidebar"><div class="user-mini"><div class="avatar">🧑🏻‍⚕️</div><div><b>dr. Zaskiya Dwi Anugrah</b><small>Dokter · Terverifikasi demo</small></div></div><div class="nav-label">PORTAL DOKTER</div><nav class="nav"><button class="${current==='docHome'?'active':''}" onclick="current='docHome';renderDoctor()"><span class="ico">⌂</span>Dashboard</button><button class="${current==='docPatients'?'active':''}" onclick="current='docPatients';renderDoctor()"><span class="ico">👥</span>Daftar Pasien</button><button class="${current==='docQueue'?'active':''}" onclick="current='docQueue';renderDoctor()"><span class="ico">🎟️</span>Antrean Pasien</button><button class="${current==='docSchedule'?'active':''}" onclick="current='docSchedule';renderDoctor()"><span class="ico">📅</span>Jadwal Praktik</button><button class="${current==='docLab'?'active':''}" onclick="current='docLab';renderDoctor()"><span class="ico">🧪</span>Hasil Lab</button></nav><div class="sidebar-bottom"><button class="danger" style="width:100%" onclick="doctorLogged=false;renderLanding()">↪ Keluar portal</button></div></aside><main class="main"><section class="hero"><div><h1>Selamat bertugas, Dokter! 👩🏻‍⚕️</h1><p>Semoga hari ini membawa banyak senyum dan kesembuhan.</p></div><div class="hero-art">🩺💚</div></section><div class="panel" style="margin-top:18px">${doctorPage()}</div></main></div>`}
function doctorPage(){if(current==='docPatients')return `<h1 class="page-title">Daftar Pasien</h1><p class="page-sub">Pasien yang terdaftar dalam sistem demo.</p>${appointments.length?`<div class="list">${appointments.map(a=>`<div class="item"><div><h4>${a.name}</h4><p>${a.doctor} · ${a.date} · ${a.complaint}</p></div><button class="soft" onclick="toast('Ringkasan keluhan: '+${JSON.stringify(a.complaint)})">Buka keluhan</button></div>`).join('')}</div>`:'<div class="card muted">Belum ada pasien terdaftar.</div>'}`;
if(current==='docQueue')return `<h1 class="page-title">Antrean Pasien 🎟️</h1><p class="page-sub">Perbarui status pelayanan pasien.</p>${appointments.length?`<div class="list">${appointments.map(a=>`<div class="item"><div><h4>${a.number} · ${a.name}</h4><p>${a.doctor} · ${a.facility} · ${a.date}</p></div><select onchange="updateStatus(${a.id},this.value)">${['Terdaftar','Menunggu','Sedang dilayani','Selesai','Dibatalkan','Tidak hadir'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div>`:'<div class="card muted">Belum ada antrean.</div>'}`;
if(current==='docSchedule')return `<h1 class="page-title">Jadwal Praktik</h1><p class="page-sub">Jadwal dokter sesuai data layanan.</p><div class="table-wrap"><table><tr><th>Hari</th><th>Dokter</th><th>Jam Praktik</th></tr>${doctors.map(d=>`<tr><td>${d.day}</td><td>${d.name}</td><td>${d.hours}</td></tr>`).join('')}</table></div>`;
if(current==='docLab')return `<h1 class="page-title">Validasi Hasil Laboratorium 🧪</h1><p class="page-sub">Contoh antrean hasil pemeriksaan yang menunggu validasi.</p><div class="card"><h3>Glukosa puasa · Pasien demo</h3><p class="muted">Hasil: 92 mg/dL · Rentang referensi: 70–100 mg/dL</p><button class="primary" onclick="toast('Hasil contoh berhasil divalidasi.')">Validasi hasil</button></div>`;
return `<h1 class="page-title">Ringkasan Praktik Hari Ini ✨</h1><div class="grid stats"><div class="stat"><div class="sicon">👥</div><strong>${appointments.length}</strong><small>Total pasien terdaftar</small></div><div class="stat"><div class="sicon">🎟️</div><strong>${appointments.filter(a=>a.status==='Menunggu'||a.status==='Terdaftar').length}</strong><small>Menunggu</small></div><div class="stat"><div class="sicon">💚</div><strong>${appointments.filter(a=>a.status==='Selesai').length}</strong><small>Selesai</small></div><div class="stat"><div class="sicon">📅</div><strong>5</strong><small>Jadwal dokter</small></div></div><div class="section-head"><h2>Pasien terbaru</h2></div>${appointments.slice(0,4).map(a=>`<div class="item" style="margin-bottom:9px"><div><h4>${a.name}</h4><p>${a.number} · ${a.complaint}</p></div><span class="tag">${a.status}</span></div>`).join('')||'<p class="muted">Belum ada pasien.</p>'}`}
function updateStatus(id,s){appointments=appointments.map(a=>a.id===id?{...a,status:s}:a);save();toast('Status antrean diperbarui.');renderDoctor()}
if(profile)renderApp();else renderLanding();
</script>
</body></html>
